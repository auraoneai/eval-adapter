[build-system]
    requires = ["setuptools>=68", "wheel"]
    build-backend = "setuptools.build_meta"

    [project]
    name = "eval-adapter"
    version = "0.1.1"
    description = "Unified rubric and run adapter for common eval frameworks."
    readme = "README.md"
    requires-python = ">=3.10"
    license = "MIT"
    authors = [{ name = "AuraOne" }]
    classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12"]
    dependencies = ["rubric-spec>=0.1.1", "PyYAML>=6.0"]

    [project.urls]
    Homepage = "https://auraone.ai/open"
    Source = "https://github.com/auraoneai/eval-adapter"

    [project.scripts]
eval-adapter = "eval_adapter.cli:main"

    [tool.setuptools.packages.find]
    where = ["src"]

    [tool.pytest.ini_options]
    addopts = "-q"
    pythonpath = ["src"]
    testpaths = ["tests"]
